name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest trimesh numpy typer rich rtree scipy scikit-learn manifold3d opencv-python-headless
          pip install -e .
      - name: Generate test fixtures
        run: |
          python tests/generate_fixtures.py
          python tests/generate_diagnose_fixtures.py
      - name: Run core tests
        run: pytest
      - name: Run OctoPrint plugin tests
        run: python -m unittest octoprint-print-doctor.tests.test_plugin
