[tool.poetry]
name = "print-doctor"
version = "0.7.0"
description = "3D printing pre-flight check and cost estimation CLI - analyze STL/3MF models for printability issues and print cost"
authors = ["Zensoro"]
license = "MIT"
readme = "README.md"
packages = [{include = "print_doctor", from = "src"}]
homepage = "https://github.com/Zensoro/3dprint-doctor"
repository = "https://github.com/Zensoro/3dprint-doctor"
keywords = ["3d-printing", "stl", "3mf", "mesh-analysis", "cost-estimation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

[tool.poetry.dependencies]
python = "^3.11"
trimesh = "^4.0.0"
numpy = "^1.24.0"
typer = {version = ">=0.12.0", extras = ["all"]}
rich = "^13.0.0"
rtree = "^1.0.0"
scipy = "^1.10.0"
scikit-learn = "^1.3.0"
opencv-python-headless = {version = "^4.10.0", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
hypothesis = "^6.80.0"
manifold3d = "^3.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
print-doctor = "print_doctor.cli:app"

[tool.poetry.extras]
vision = ["opencv-python-headless"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["octoprint-print-doctor"]
