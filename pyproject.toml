[tool.poetry]
name = "print-doctor"
version = "0.1.0"
description = "3D printing pre-flight check and cost estimation tool"
authors = ["Zensoro"]
license = "MIT"
readme = "README.md"
packages = [{include = "print_doctor", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
trimesh = "^4.0.0"
numpy = "^1.24.0"
typer = {version = ">=0.12.0", extras = ["all"]}
rich = "^13.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
hypothesis = "^6.80.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
print-doctor = "print_doctor.cli:app"
